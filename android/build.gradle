group 'io.carius.lars.ar_flutter_plugin'
version '1.0-SNAPSHOT'

buildscript {
    ext.kotlin_version = '2.3.21'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.6.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace "io.carius.lars.ar_flutter_plugin"
    compileSdkVersion 36

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }
    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
        ndkVersion = "28.2.13676358"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    buildFeatures {
        compose true
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "com.google.ar:core:1.54.0"

    // SceneView 4.16.x (16KB対応, Sceneform後継) ※ Compose専用
    implementation 'io.github.sceneview:arsceneview:4.16.10'

    // Compose (ComposeView で ARScene をホストするため)
    implementation platform('androidx.compose:compose-bom:2026.05.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'

    implementation 'androidx.appcompat:appcompat:1.7.1'

    // Flutter PlatformView 内 ComposeView へ ViewTree*Owner を供給するために必須。
    // appcompat/activity 経由では implementation スコープのため消費側 compile クラスパスに
    // 漏れず Unresolved reference になる(実ビルドで判明)。明示宣言する。
    // savedstate は SavedStateRegistryController.performAttach() を使うため 1.3.x 以上。
    implementation 'androidx.lifecycle:lifecycle-runtime:2.9.2'      // ViewTreeLifecycleOwner
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.9.2'    // ViewTreeViewModelStoreOwner
    implementation 'androidx.savedstate:savedstate:1.3.2'           // ViewTreeSavedStateRegistryOwner / performAttach

    // 自前 Recomposer を駆動する CoroutineScope/launch/cancel に必要。Compose 経由の
    // 推移依存は implementation スコープで compile に漏れない恐れがあるため明示宣言。
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
}

afterEvaluate {
    def containsEmbeddingDependencies = false
    for (def configuration : configurations.all) {
        for (def dependency : configuration.dependencies) {
            if (dependency.group == 'io.flutter' &&
                    dependency.name.startsWith('flutter_embedding') &&
                    dependency.isTransitive())
            {
                containsEmbeddingDependencies = true
                break
            }
        }
    }
    if (!containsEmbeddingDependencies) {
        android {
            dependencies {
                def lifecycle_version = "1.1.1"
                compileOnly "android.arch.lifecycle:runtime:$lifecycle_version"
                compileOnly "android.arch.lifecycle:common:$lifecycle_version"
                compileOnly "android.arch.lifecycle:common-java8:$lifecycle_version"
            }
        }
    }
}
